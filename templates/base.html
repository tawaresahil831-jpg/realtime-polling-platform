<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Real-Time Polling & Survey Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="{{ url_for('index') }}" class="brand-logo">
                <span class="logo-icon">📊</span>
                <span class="brand-text">Nova<strong>Poll</strong></span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">All Polls</a>
                <a href="{{ url_for('create_poll_page') }}" class="btn btn-primary btn-sm">+ Create Poll</a>
            </nav>
        </div>
    </header>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-container">
            <p>Real-Time Polling & Survey Platform &bull; CodeNova Full Stack Internship (Batch 02, Task 3)</p>
            <p class="footer-meta">Powered by Python 3.9, Flask &amp; SQLite &bull; Zero Build Step</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
